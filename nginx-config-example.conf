# Configuración NGINX de antoniomorales.cl (sitio estático generado por Astro)
# En el VPS vive en /etc/nginx/sites-available/antoniomorales.cl.
# Las líneas de SSL las agrega y mantiene Certbot.

server {
    server_name antoniomorales.cl www.antoniomorales.cl;

    root /root/portfolio-live;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Assets con hash de Astro: cache inmutable
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/antoniomorales.cl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/antoniomorales.cl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.antoniomorales.cl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = antoniomorales.cl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name antoniomorales.cl www.antoniomorales.cl;
    return 404; # managed by Certbot
}
